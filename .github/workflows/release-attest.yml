name: Build and attest plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attest (defaults to current ref)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Verify build output
        run: |
          test -f main.js || (echo "main.js not produced" && exit 1)
          echo "main.js size: $(wc -c < main.js) bytes"

      - name: Generate artifact attestation for main.js
        uses: actions/attest@v4
        with:
          subject-path: "main.js"

      - name: Upload main.js to release (release event only)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" main.js --clobber
